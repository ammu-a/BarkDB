<!DOCTYPE html>
<html>
<head>
    <title>BarkDB Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        function toggleProviderFields() {
            const role = document.querySelector('input[name="user_type"]:checked').value;
            document.getElementById('provider-fields').style.display = role === 'provider' ? 'block' : 'none';
            document.getElementById('owner-fields').style.display = role === 'owner' ? 'block' : 'none';
        }
    </script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center">🐶 Join the BarkDB Pack!</h2>
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-info">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}
            <form method="POST" action="/signup">
                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="text" name="email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Username:</label>
                    <input type="text" name="username" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password:</label>
                    <input type="password" name="password" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Are you a:</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="user_type" value="owner" onclick="toggleProviderFields()" checked>
                        <label class="form-check-label">Pet Owner</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="user_type" value="provider" onclick="toggleProviderFields()">
                        <label class="form-check-label">Provider</label>
                    </div>
                </div>

                <div id="owner-fields">
                    <div class="mb-3"><label class="form-label">Owner Name:</label>
                        <input type="text" name="owner_name" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Pet Type:</label>
                        <input type="text" name="pet_type" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Breed:</label>
                        <input type="text" name="breed" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Pet Name:</label>
                        <input type="text" name="pet_name" class="form-control"></div>
                </div>

                <div id="provider-fields" style="display:none;">
                    <div class="mb-3"><label class="form-label">Zipcode:</label>
                        <input type="text" name="zipcode" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">City:</label>
                        <input type="text" name="city" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Province:</label>
                        <input type="text" name="province" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Home Type:</label>
                        <input type="text" name="home_type" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Years of Experience:</label>
                        <input type="number" name="experience" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Repeat Clients:</label>
                        <input type="number" name="repeat_clients" class="form-control"></div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="pets_at_home" value="1">
                        <label class="form-check-label">Pets at Home</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="children_at_home" value="1">
                        <label class="form-check-label">Children at Home</label>
                    </div>
                    <div class="mb-3"><label class="form-label">About Me:</label>
                        <textarea name="about_me" class="form-control"></textarea></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>
        </div>
    </div>
</body>
</html>
