<!DOCTYPE html>
<html>
<head>
    <title>Add Rate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center">📈 Add New Rate</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="/add_rate">
                <div class="mb-3">
                    <label class="form-label">Provider ID:</label>
                    <input type="text" name="provider_id" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Service:</label>
                    <select name="service_id" class="form-select" required>
                        {% for service in services %}
                            <option value="{{ service.ServiceID }}">{{ service.ServiceName }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rate:</label>
                    <input type="number" name="rate" class="form-control" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Rate Type:</label>
                    <select name="rate_type" class="form-select" required>
                        {% for rt in rate_types %}
                            <option value="{{ rt }}">{{ rt }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Effective Date:</label>
                    <input type="date" name="effective_date" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Add Rate</button>
            </form>
        </div>
    </div>
</body>
</html>
