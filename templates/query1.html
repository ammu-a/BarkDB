<!DOCTYPE html>
<html>
<head>
    <title>Ranked Providers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>🔢 Ranked Providers by Years of Experience</h3>
    <table class="table table-bordered table-striped mt-3">
        <thead>
            <tr>
                <th>Row #</th><th>Provider ID</th><th>Name</th><th>Experience</th><th>RANK</th><th>DENSE_RANK</th>
            </tr>
        </thead>
        <tbody>
        {% for row in data %}
            <tr>
                <td>{{ row.row_num1 }}</td>
                <td>{{ row.ProviderID }}</td>
                <td>{{ row.ProviderName }}</td>
                <td>{{ row.YearsExperience }}</td>
                <td>{{ row.s_rank }}</td>
                <td>{{ row.s_dense_rank }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary">⬅ Back</a>
</div>
</body>
</html>
