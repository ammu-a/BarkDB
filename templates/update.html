<!DOCTYPE html>
<html>
<head>
    <title>Update Provider</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Update Provider</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input type="number" name="provider_id" placeholder="Provider ID" class="form-control mb-2" required>
        <input type="text" name="home_type" placeholder="Home Type" class="form-control mb-2">
        <input type="number" name="children_at_home" placeholder="Children at Home" class="form-control mb-2">
        <input type="number" name="years_experience" placeholder="Years of Experience" class="form-control mb-2">
        <input type="text" name="pet_at_home" placeholder="Pet At Home" class="form-control mb-2">
        <textarea name="about_me" placeholder="About Me" class="form-control mb-2"></textarea>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
